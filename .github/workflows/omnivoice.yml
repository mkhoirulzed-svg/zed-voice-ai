name: ZED Voice AI - OmniVoice

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Opaque job ID. Input files must already exist in private R2."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: omnivoice-${{ github.event.inputs.job_id }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      R2_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      HF_HOME: ${{ runner.temp }}/hf
    steps:
      - name: Validate job ID
        shell: bash
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: |
          if [[ ! "$JOB_ID" =~ ^[A-Za-z0-9_-]{8,80}$ ]]; then
            echo "Invalid job ID format."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU runtime and OmniVoice
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install omnivoice boto3 soundfile

      - name: Generate cloned speech
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: python scripts/run_omnivoice.py
